<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetson - Overflow Robotics</title>
<link rel="stylesheet" href="common.css">
<style>
/* styles for this page only go here (colors and the top bar come from common.css) */
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><h1 class="brand">Overflow Robotics</h1><nav class="nav" id="nav" aria-label="Pages"></nav></header>
  <main class="page">
    <h2 id="title"></h2>
    <p class="dim" id="blurb"></p>
    <p id="status" aria-live="polite">Waiting for dashboard data...</p>
    <p id="temps" class="dim"></p>
    <p><a href="index.html">Open the dashboard for SSH, camera and fan controls</a></p>
  </main>
</div>

<script src="common.js"></script>
<script src="backend.js"></script>
<script>
buildNav();
const me = PAGES.find((p) => p.href === location.pathname.split("/").pop());
if (me) { $("title").textContent = me.name; $("blurb").textContent = me.blurb; }

function updateJetsonStatus() {
  const d = backend.get_data();
  const j = d.jetson || { ssh: "disconnected", cameras: "unknown" };
  $("status").textContent = `SSH: ${SSH_TEXT[j.ssh] || j.ssh}; cameras: ${CAM_TEXT[j.cameras] || j.cameras}`;
  const cpu = d.jetson_cpu_c == null ? "—" : d.jetson_cpu_c.toFixed(1) + " °C";
  const gpu = d.jetson_gpu_c == null ? "—" : d.jetson_gpu_c.toFixed(1) + " °C";
  $("temps").textContent = `CPU: ${cpu} · GPU: ${gpu}`;
}
setInterval(updateJetsonStatus, 500);
updateJetsonStatus();
</script>
</body>
</html>
